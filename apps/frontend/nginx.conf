server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location /api/auth {
        proxy_pass http://${AUTH_SERVICE_URL};
    }
    location /api/admin {
        proxy_pass http://${AUTH_SERVICE_URL};
    }
    location /api/drawings {
        proxy_pass http://${SIMULATION_SERVICE_URL};
    }
    location /api/simulations {
        proxy_pass http://${SIMULATION_SERVICE_URL};
    }
    location /api/layout-searches {
        proxy_pass http://${SIMULATION_SERVICE_URL};
    }
    location /api/regulations {
        proxy_pass http://${REGULATION_SERVICE_URL};
    }
    location /api/reports {
        proxy_pass http://${REGULATION_SERVICE_URL};
    }
    location /api/risks {
        proxy_pass http://${REGULATION_SERVICE_URL};
    }
    location /api/safety-checks {
        proxy_pass http://${REGULATION_SERVICE_URL};
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
