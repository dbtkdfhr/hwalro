plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '7.0.2'
}

group = 'com.hwalro'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

def readDotEnv = { File envFile ->
    def values = [:]
    if (!envFile.exists() || envFile.isDirectory()) {
        return values
    }

    envFile.eachLine('UTF-8') { rawLine ->
        def line = rawLine.trim()
        if (!line || line.startsWith('#')) {
            return
        }

        def separatorIndex = line.indexOf('=')
        if (separatorIndex <= 0) {
            return
        }

        def key = line.substring(0, separatorIndex).trim()
        def value = line.substring(separatorIndex + 1).trim()
        if (value.size() >= 2
                && ((value.startsWith('"') && value.endsWith('"'))
                        || (value.startsWith("'") && value.endsWith("'")))) {
            value = value.substring(1, value.size() - 1)
        }
        values[key] = value
    }
    return values
}

def localEnvironment = readDotEnv(rootProject.file('../../.env'))
def resolveEnvironment = { String name, String defaultValue = '' ->
    return System.getenv(name) ?: localEnvironment[name] ?: defaultValue
}

dependencies {
    // Common
    implementation 'org.springframework.boot:spring-boot-starter-web'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Persistence
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'

    // JWT validation
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Caching for external law API responses
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Swagger / OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

    // Spring AI
    implementation('org.springframework.ai:spring-ai-starter-model-openai') {
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.ai:spring-ai-bom:1.0.9'
    }
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'openai'
    }
}

tasks.register('openAiSmokeTest', Test) {
    group = 'verification'
    description = 'Calls OpenAI once and prints a structured AI report draft.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'openai'
    }

    environment 'OPENAI_API_KEY', resolveEnvironment('OPENAI_API_KEY')
    environment 'OPENAI_MODEL', resolveEnvironment('OPENAI_MODEL', 'gpt-5.4-nano')
    environment 'OPENAI_MAX_COMPLETION_TOKENS', resolveEnvironment('OPENAI_MAX_COMPLETION_TOKENS', '1800')

    doFirst {
        if (!resolveEnvironment('OPENAI_API_KEY')) {
            throw new GradleException('Set OPENAI_API_KEY in the root .env file or current shell environment.')
        }
    }

    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
}

tasks.named('bootRun') {
    def openAiApiKey = resolveEnvironment('OPENAI_API_KEY')
    if (openAiApiKey) {
        environment 'OPENAI_API_KEY', openAiApiKey
        environment 'OPENAI_MODEL', resolveEnvironment('OPENAI_MODEL', 'gpt-5.4-nano')
        environment 'OPENAI_MAX_COMPLETION_TOKENS', resolveEnvironment('OPENAI_MAX_COMPLETION_TOKENS', '1800')
        environment 'OPENAI_RETRY_MAX_ATTEMPTS', resolveEnvironment('OPENAI_RETRY_MAX_ATTEMPTS', '3')
        environment 'SPRING_PROFILES_ACTIVE', resolveEnvironment('SPRING_PROFILES_ACTIVE', 'ai')
    }
}

spotless {
    java {
        target 'src/**/*.java'
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        palantirJavaFormat()
    }
}
