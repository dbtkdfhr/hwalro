server:
  port: ${REGULATION_SERVICE_PORT:8082}

law-api:
  # 국가법령정보센터의 공식 API 주소. 호출 대상이 바뀔 때만 수정한다.
  base-url: https://www.law.go.kr
  # 인증값은 로컬 .env 또는 배포 환경 변수에서만 주입하며 Git에 기록하지 않는다.
  oc: ${LAW_API_OC:}
  # 검색 전 좌측 목록을 구성하는 대피·공간 안전 관련 기본 키워드다.
  default-keywords:
    - 소방
    - 피난
    - 건축
    - 다중이용업소
    - 재난
    - 시설안전

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  application:
    name: regulation-service

  cache:
    # 국가법령정보센터 외부 호출을 메모리에 캐싱한다. 법령 데이터는 개정 전까지 불변이므로 하루 TTL로 충분하다.
    # maximumSize는 캐시명별로 각각 적용된다.
    type: caffeine
    caffeine:
      spec: maximumSize=300,expireAfterWrite=1d

  # 기본 실행에서는 AI 모델을 만들지 않는다. OpenAI 사용 시 ai 프로필을 활성화한다.
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

  datasource:
    url: ${REGULATION_DB_URL:jdbc:mysql://localhost:3307/hwalro_regulation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${REGULATION_DB_USERNAME:hwalro_regulation}
    password: ${REGULATION_DB_PASSWORD:hwalro_regulation}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: ${DB_INIT_MODE:never}
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:}
  issuer: ${JWT_ISSUER:hwalro-auth-service}

auth-service:
  base-url: ${AUTH_SERVICE_URL:http://localhost:8080}
  connect-timeout: ${AUTH_SERVICE_CONNECT_TIMEOUT:2s}
  read-timeout: ${AUTH_SERVICE_READ_TIMEOUT:10s}

simulation-service:
  base-url: ${SIMULATION_SERVICE_URL:http://localhost:8081}
  connect-timeout: ${SIMULATION_SERVICE_CONNECT_TIMEOUT:2s}
  read-timeout: ${SIMULATION_SERVICE_READ_TIMEOUT:10s}
  max-result-count: ${SIMULATION_SERVICE_MAX_RESULT_COUNT:6}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
